<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NumVault — Public Integer Catalog</title>
  <meta name="description" content="Explore pure positive integers, prime factorizations, divisors, and base representations on NumVault.">
  <meta name="robots" content="index, follow">
  <style>
    :root { 
      --bg: #0f1115; --card: #181b21; --border: #2a2f3a; 
      --text: #e6e8ec; --muted: #9aa0aa; --accent: #4f8cff; 
    }
    * { box-sizing: border-box; }
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background: var(--bg); color: var(--text); 
      margin: 0; padding: 2rem 1rem; line-height: 1.6; 
    }
    .container { max-width: 780px; margin: 0 auto; }
    header.site-header { 
      display: flex; justify-content: space-between; align-items: center; 
      margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); 
    }
    header.site-header a { color: var(--text); text-decoration: none; font-weight: 600; font-size: 1.1rem; }
    header.site-header a:hover { color: var(--accent); }
    footer.site-footer { 
      text-align: center; margin-top: 3rem; font-size: 0.85rem; color: var(--muted); 
      border-top: 1px solid var(--border); padding-top: 1.5rem; display: flex; justify-content: space-between; align-items: center;
    }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; }
    input, button { background: #111318; color: var(--text); border: 1px solid var(--border); padding: 0.6rem 0.8rem; border-radius: 4px; font-size: 0.95rem; }
    input:focus { outline: 2px solid var(--accent); border-color: transparent; }
    .btn { background: var(--accent); color: #fff; border: none; font-weight: 600; cursor: pointer; }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <header class="site-header">
      <a href="/index.html">NumVault 🗄️</a>
      <span style="color: var(--muted); font-size: 0.9rem;">Public Integer Catalog &amp; Number Theory Engine</span>
    </header>

    <div class="card" style="text-align: center; padding: 2.5rem 1.5rem;">
      <h2 style="margin-top: 0; font-size: 2rem;">Search &amp; Jump to Integer</h2>
      <p style="color: var(--muted); margin-bottom: 1.5rem;">Enter any positive integer to view its comprehensive record:</p>
      <form onsubmit="jumpToNumber(event)" style="display: flex; gap: 0.5rem; justify-content: center; max-width: 450px; margin: 0 auto;">
        <input type="number" id="jump-input" min="1" placeholder="e.g. 42" required style="flex: 1;" />
        <button type="submit" class="btn">Search</button>
      </form>
    </div>

    <div class="card">
      <h2>Quick Catalog Directory</h2>
      <p style="color: var(--muted); font-size: 0.9rem;">Quick links to numbers 1 through 100:</p>
      <ul style="display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 0.5rem; list-style: none; padding: 0; margin-top: 1rem;">
        <script>
          for (let i = 1; i <= 100; i++) {
            document.write(`<li><a href="/number.html?n=${i}" style="display: block; background: #111318; border: 1px solid var(--border); padding: 0.5rem; text-align: center; border-radius: 4px; color: var(--accent); text-decoration: none; font-variant-numeric: tabular-nums;">${i}</a></li>`);
          }
        </script>
      </ul>
    </div>

    <footer class="site-footer">
      <span>NumVault &copy; 2026</span>
      <span style="color: var(--muted);">Pure Positive Integer Database</span>
    </footer>
  </div>

  <script>
    function jumpToNumber(e) {
      e.preventDefault();
      const num = document.getElementById('jump-input').value;
      if (num && parseInt(num, 10) >= 1) {
        window.location.href = '/number.html?n=' + parseInt(num, 10);
      }
    }
  </script>
</body>
</html>
